name: EEN Matching

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'   # codziennie o 8:00

jobs:
  een-matching:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EEN Matcher
        run: python een_matcher.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: een-raport
          path: |
            raport_een.html
            raport_een.pdf
