name: EEN Matching

on:
  workflow_dispatch:     # ręczne uruchamianie
  schedule:
    - cron: '0 9 * * *'  # codziennie o 9:00

jobs:
  een-matching:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas imaplib2 weasyprint

      - name: Run EEN Matcher
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python een_matcher.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: EEN-Raport
          path: |
            raport_een.html
            raport_een.pdf
          retention-days: 30
